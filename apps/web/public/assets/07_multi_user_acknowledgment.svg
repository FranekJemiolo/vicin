<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" fill="#090A0F">
  <rect width="390" height="844" fill="#090A0F"/>
  <!-- Status Bar -->
  <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:43</text>
  <circle cx="330" cy="34" r="4" fill="#F8FAFC"/>
  <rect x="342" y="30" width="18" height="9" rx="2.5" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>

  <!-- Top Bar -->
  <text x="24" y="80" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">VICIN PULSE</text>
  <text x="24" y="108" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Oakwood Neighbors</text>

  <!-- Multi-user broadcast card -->
  <rect x="20" y="130" width="350" height="210" rx="20" fill="#12141C" stroke="#10B981" stroke-width="1.5"/>

  <!-- Author Header -->
  <circle cx="50" cy="165" r="18" fill="#1E293B"/>
  <text x="44" y="171" fill="#10B981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">A</text>
  <text x="80" y="162" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Alex Chen (Building 4)</text>
  <text x="80" y="178" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Broadcasted 4m ago</text>

  <!-- Countdown Badge -->
  <rect x="260" y="152" width="94" height="26" rx="13" fill="#10B981" fill-opacity="0.15"/>
  <text x="307" y="169" text-anchor="middle" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">41m remaining</text>

  <!-- Activity Pill -->
  <rect x="36" y="196" width="318" height="60" rx="14" fill="#1A1D27"/>
  <circle cx="66" cy="226" r="16" fill="#12141C"/>
  <text x="59" y="232" font-size="16">☕</text>
  <text x="96" y="222" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Coffee Break at Lobby</text>
  <text x="96" y="240" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Grab an espresso or tea before the standup</text>

  <!-- Acknowledged Avatars & Active Button -->
  <circle cx="52" cy="305" r="12" fill="#3B82F6"/>
  <text x="48" y="309" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">B</text>
  <circle cx="70" cy="305" r="12" fill="#8B5CF6"/>
  <text x="66" y="309" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">C</text>
  <text x="92" y="309" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">2 neighbors in</text>

  <!-- Acknowledged CTA State -->
  <rect x="240" y="285" width="114" height="40" rx="12" fill="#10B981"/>
  <text x="297" y="310" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">✓ I'm In!</text>
</svg>
