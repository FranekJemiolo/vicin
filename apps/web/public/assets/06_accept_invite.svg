<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" fill="#090A0F">
  <rect width="390" height="844" fill="#090A0F"/>
  <!-- Status Bar -->
  <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:42</text>
  <circle cx="330" cy="34" r="4" fill="#F8FAFC"/>
  <rect x="342" y="30" width="18" height="9" rx="2.5" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>

  <!-- Centered Accept Card -->
  <rect x="24" y="160" width="342" height="420" rx="24" fill="#12141C" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="195" cy="230" r="40" fill="#10B981" fill-opacity="0.15"/>
  <text x="178" y="242" font-size="34">🏡</text>
  
  <text x="195" y="300" text-anchor="middle" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INVITATION RECEIVED</text>
  <text x="195" y="332" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">Oakwood Neighbors</text>
  <text x="195" y="360" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Invited by Sarah Jenkins</text>

  <!-- Member Count Badge -->
  <rect x="145" y="385" width="100" height="26" rx="13" fill="#1E293B"/>
  <text x="195" y="402" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">14 Members Active</text>

  <!-- Accept CTA -->
  <rect x="48" y="440" width="294" height="50" rx="14" fill="#10B981"/>
  <text x="195" y="471" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Join Oakwood Neighbors</text>

  <!-- Decline CTA -->
  <text x="195" y="525" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Decline Invitation</text>
</svg>
